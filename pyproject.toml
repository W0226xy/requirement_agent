[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "requirement-agent"
version = "0.1.0"
description = "Multi-channel requirement management agent"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "alembic>=1.14,<2",
  "asyncpg>=0.30,<1",
  "celery[redis]>=5.6.3,<5.7",
  "fastapi>=0.115,<1",
  "greenlet>=3,<4",
  "httpx>=0.28,<1",
  "langgraph>=1.0,<2",
  "minio>=7.2,<8",
  "pillow>=11,<13",
  "pydantic-settings>=2.7,<3",
  "pymupdf>=1.25,<2",
  "python-docx>=1.1,<2",
  "python-multipart>=0.0.20,<1",
  "pgvector>=0.4,<1",
  "sqlalchemy[asyncio]>=2.0.36,<3",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
parsers = [
  "numpy>=2,<3",
  "paddleocr>=3,<4",
  "paddlepaddle>=3,<4",
]
dev = [
  "aiosqlite>=0.20,<1",
  "mypy>=1.14,<2",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.25,<1",
  "ruff>=0.9,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/requirement_agent"]

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
pythonpath = [".", "src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
packages = ["requirement_agent", "apps"]

[[tool.mypy.overrides]]
module = [
  "celery.*",
  "docx.*",
  "fitz.*",
  "minio.*",
  "numpy.*",
  "paddleocr.*",
  "pymupdf",
  "pymupdf.*",
]
ignore_missing_imports = true
disallow_untyped_calls = false
